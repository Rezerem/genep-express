services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: genepexpress_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: genep
      POSTGRES_PASSWORD: genep
      POSTGRES_DB: genepexpress
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: genepexpress_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5